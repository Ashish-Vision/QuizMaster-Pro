name: Bug report
description: Report reproducible incorrect behavior without sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include passwords, tokens, cookies, connection strings, or private user data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal local steps and sanitized test data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Local environment
      placeholder: Node version, MongoDB version, browser, operating system
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
